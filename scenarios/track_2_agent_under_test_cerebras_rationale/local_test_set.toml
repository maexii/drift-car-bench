# Local full test-set scenario for the Track 2 rationale-carryover Cerebras agent under test.

[evaluator]
endpoint = "http://127.0.0.1:8081"
cmd = "python src/evaluator/server.py --host 127.0.0.1 --port 8081"

[agent_under_test]
endpoint = "http://127.0.0.1:8080"
# Rationale knob: --max-notes caps how many private step notes are fed back
# into the next choose-action prompt.
cmd = "python src/track_2_agent_under_test_cerebras_rationale/server.py --host 127.0.0.1 --port 8080 --max-notes 12"

[config]
num_trials = 3
task_split = "test"
tasks_base_num_tasks = 10
tasks_hallucination_num_tasks = 10
tasks_disambiguation_num_tasks = 10
max_steps = 50

# User-Simulator via OpenRouter BYOK -> Google Vertex (OPENROUTER_API_KEY in .env)
user_model = "openrouter/google/gemini-2.5-flash"
user_provider = "openrouter"
user_thinking = false                 # kein reasoning_effort mitschicken

# Policy-Judge ebenfalls ueber OpenRouter BYOK -> Google Vertex.
policy_evaluator_model = "openrouter/google/gemini-2.5-flash"
policy_evaluator_provider = "openrouter"
