# Focused validation for the unavailable_information checks field.
# Targets: the 11 deterministic missing-RESPONSE hallucination fails from the
# 2026-07-08 full test-set run. Controls: tasks known to be sensitive to
# rule/schema changes (hall_19 tool-missing, hall_5/13/17, base_5/9 guessing,
# dis_7/13 preference lookup).

[evaluator]
endpoint = "http://127.0.0.1:8081"
cmd = "python src/evaluator/server.py --host 127.0.0.1 --port 8081"

[agent_under_test]
endpoint = "http://127.0.0.1:8080"
cmd = "python src/track_2_agent_under_test_cerebras_maxi/server.py --host 127.0.0.1 --port 8080"

[config]
num_trials = 3
task_split = "test"
tasks_base_num_tasks = -1
tasks_hallucination_num_tasks = -1
tasks_disambiguation_num_tasks = -1
max_steps = 50

tasks_base_task_id_filter = ["base_5", "base_9"]
tasks_hallucination_task_id_filter = [
  "hallucination_11", "hallucination_25", "hallucination_27",
  "hallucination_37", "hallucination_41", "hallucination_45",
  "hallucination_47", "hallucination_49", "hallucination_51",
  "hallucination_59", "hallucination_61",
  "hallucination_5", "hallucination_13", "hallucination_17", "hallucination_19",
]
tasks_disambiguation_task_id_filter = ["disambiguation_7", "disambiguation_13"]

# User-Simulator via OpenRouter BYOK -> Google Vertex (OPENROUTER_API_KEY in .env)
user_model = "openrouter/google/gemini-2.5-flash"
user_provider = "openrouter"
user_thinking = false

# Policy-Judge ebenfalls ueber OpenRouter BYOK -> Google Vertex.
policy_evaluator_model = "openrouter/google/gemini-2.5-flash"
policy_evaluator_provider = "openrouter"
